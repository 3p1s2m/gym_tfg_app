name: gym_tfg_app
description: "A new Flutter project for Gym Management with AI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.4
  flutter_colorpicker: ^1.1.0

  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0

  http: ^1.6.0
  web_socket_channel: ^3.0.3


  google_generative_ai: ^0.4.0


  shared_preferences: ^2.5.4
  image_picker: ^1.2.1
  file_picker: ^10.3.10


  fl_chart: ^1.2.0
  table_calendar: ^3.2.0


  cached_network_image: ^3.4.1
  intl: ^0.20.2
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true


  assets:
    - assets/images/
